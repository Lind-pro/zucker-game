<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>小小学习乐园</title>
  <meta name="description" content="给小朋友的学习乐园：拼音、汉字、笔画、数字、英文字母、常见单词和五子棋启蒙。">
  <meta name="theme-color" content="#20796b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="学习乐园">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="shared/home.css">
  <script src="pinyin/vendor/lucide.min.js" defer></script>
  <script src="shared/catalog.js" defer></script>
  <script src="shared/home.js" defer></script>
</head>
<body>
  <div class="home">
    <header class="site-header">
      <div class="brand"><img src="icon.svg" alt="" width="50" height="50"><h1>小小学习乐园</h1></div>
      <div class="header-tools">
        <div class="star-total" aria-label="学习星星"><i data-lucide="star"></i><span id="totalStars">0</span></div>
        <button id="mute" class="icon-button" aria-label="关闭首页声音" aria-pressed="false" data-tip="关闭首页声音"><i data-lucide="volume-2"></i></button>
      </div>
    </header>
    <main>
      <div class="learning-heading"><h2>我的学习</h2><span id="lessonCount">8 个学习项目</span></div>
      <nav id="subjects" class="subjects" aria-label="学习分类"></nav>
      <section id="resume" class="resume" aria-label="继续学习" hidden>
        <img id="resumeImage" src="shared/previews/pinyin.svg" alt="" width="64" height="48">
        <div><span class="resume-caption">上次学习</span><strong id="resumeTitle"></strong></div>
        <a id="resumeLink" class="resume-link"><span>继续学习</span><i data-lucide="arrow-right"></i></a>
      </section>
      <div id="lessons" class="lesson-grid"></div>
      <p id="voiceStatus" class="voice-status" role="status" aria-live="polite"></p>
      <noscript><p>请打开浏览器的 JavaScript，再进入学习乐园。</p></noscript>
    </main>
    <footer><i data-lucide="sprout"></i><span>一点一点，学会更多</span></footer>
  </div>
</body>
</html>
